services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - model-cache:/root/.cache/huggingface

volumes:
  model-cache:
